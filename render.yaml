# Render Blueprint for PsyApi Backend
# Deploy this ASP.NET Core backend to Render with PostgreSQL (Neon)
# DOCKER RUNTIME - Includes Arabic fonts + HarfBuzz for PDF rendering

services:
  # Backend API Service
  - type: web
    name: psy-api-backend
    runtime: docker
    region: oregon # Choose: oregon, frankfurt, singapore, ohio
    plan: free # Upgrade to starter for always-on ($7/mo)
    
    # Repository Configuration
    repo: https://github.com/MF860/psy-tests-platform
    branch: develop
    dockerfilePath: backend/PsyApi/Dockerfile
    dockerContext: backend/PsyApi
    
    # Health Check
    healthCheckPath: /health
    
    # Environment Variables
    envVars:
      # ASP.NET Core Configuration
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      
      # SDJ Configuration (REQUIRED - must be "1" to enable SDJ mode)
      - key: USE_SDJ
        value: "1"
      
      - key: USE_SQLITE
        value: "0"
      
      # Database Connection - Neon PostgreSQL
      # MUST SET MANUALLY via Render Dashboard (DO NOT COMMIT SECRETS)
      - key: ConnectionStrings__DefaultConnection
        sync: false # Example: Host=ep-xxx.neon.tech;Database=neondb;Username=neondb_owner;Password=xxx;Ssl Mode=Require;Trust Server Certificate=true
      
      # CORS Configuration - UPDATE after deploying frontends
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Example: https://user-ui-xxx.vercel.app,https://admin-ui-xxx.vercel.app
      
      # PDF Configuration (Optional)
      - key: PDF_FONT_FALLBACK
        value: Noto Naskh Arabic
      
      # AI Configuration (OPTIONAL - only if using DeepSeek/OpenRouter)
      - key: OPENROUTER_API_KEY
        sync: false # Set manually if using AI features
      
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-chat
      
      # JWT Configuration
      - key: Jwt__Secret
        generateValue: true # Render will auto-generate a secure secret
      
      - key: Jwt__Issuer
        value: PsyApi
      
      - key: Jwt__Audience
        value: PsyApiClients
      
      - key: Jwt__ExpiryMinutes
        value: "1440" # 24 hours

# Deployment Notes:
# 
# 1. BEFORE DEPLOYING:
#    - Create Neon PostgreSQL database (see docs/DEPLOY_NEON.md)
#    - Get your Neon connection string
#    - Have your DeepSeek API key ready (get from https://platform.deepseek.com)
#
# 2. IN RENDER DASHBOARD:
#    Set these environment variables manually (DO NOT commit secrets to git):
#    
#    ConnectionStrings__DefaultConnection=Host=ep-xxx.neon.tech;Database=psy_prod;Username=user;Password=pass;SSL Mode=Require;Trust Server Certificate=true
#    DEEPSEEK_API_KEY=sk-xxxxxxxxxxxxxxxxx
#    ADMIN_SEED_PASSWORD=YourSecurePassword123!
#    Jwt__Secret=(will be auto-generated by Render)
#
# 3. CORS CONFIGURATION:
#    After deploying frontends to Vercel, update CORS in Program.cs with actual domains:
#    - Replace https://*.vercel.app with specific domains
#    - Or use environment variables for CORS origins
#
# 4. VERIFICATION:
#    - Check /health endpoint: https://psy-api-backend.onrender.com/health
#    - Should return: {"status":"healthy","useSdj":true}
#    - Check logs for "Database migrations completed successfully"
#    - Verify seeding completed without errors
#
# 5. FREE TIER LIMITS:
#    - Service spins down after 15 minutes of inactivity
#    - First request after spin-down takes 30-60 seconds (cold start)
#    - Upgrade to Starter ($7/mo) for always-on service
#
# 6. MONITORING:
#    - View logs in Render dashboard
#    - Monitor health checks
#    - Set up alerts for failed deploys
#
# 7. SCALING:
#    - Free tier: 512 MB RAM, 0.1 CPU
#    - Starter: 512 MB RAM, 0.5 CPU
#    - Standard: 2 GB RAM, 1 CPU (recommended for production)
